  detail: >-
    Big Lots is a closeout discount retailer whose relaunched biglots.com is a WordPress
    marketing site (weekly ad, store locator, departments) that 404s on every developer,
    API, OpenAPI, agent-card and llms.txt path, blocks its own /wp-json/ index with a 403,
    points vendors at Word-document routing guides on vwstores.com rather than an EDI or
    supplier API, and api./developer./help.biglots.com no longer resolve.
