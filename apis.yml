aid: big-lots
name: Big Lots
description: >-
  Big Lots is a discount retailer offering a wide assortment of brand-name
  closeout merchandise including furniture, food, consumables, seasonal
  products, soft home, hard home, and electronics. Big Lots operated hundreds
  of stores across the United States. Big Lots filed for Chapter 11 in
  September 2024; a planned sale to Nexus Capital Management fell through, and
  in January 2025 Gordon Brothers Retail Partners acquired the company's assets
  and sold the Big Lots brand, up to 400 stores and distribution centers to
  Variety Wholesalers, which relaunched biglots.com in 2026. Big Lots publishes
  no developer program, API, SDK or machine-readable contract.
